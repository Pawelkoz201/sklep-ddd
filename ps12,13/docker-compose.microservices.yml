version: "3.9"

services:
  api-gateway:
    image: nginx:1.27-alpine
    container_name: sklep-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.microservices.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - identity-service
      - catalog-service
      - sales-service

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: sklep-identity-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityDb: Host=identity-db;Port=5432;Database=identity_db;Username=identity_user;Password=identity_pass
      Jwt__Issuer: Sklep
      Jwt__Audience: SklepUsers
      Jwt__SecretKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    depends_on:
      - identity-db

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: sklep-catalog-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDb: Host=catalog-db;Port=5432;Database=catalog_db;Username=catalog_user;Password=catalog_pass
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Password: guest
    depends_on:
      - catalog-db
      - rabbitmq

  sales-service:
    build:
      context: ./services/sales-service
      dockerfile: Dockerfile
    container_name: sklep-sales-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://sales-mongo:27017
      Mongo__Database: sales_db
      Redis__ConnectionString: sales-redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Password: guest
      Jwt__Issuer: Sklep
      Jwt__Audience: SklepUsers
      Jwt__SecretKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    depends_on:
      - sales-mongo
      - sales-redis
      - rabbitmq

  frontend:
    build:
      context: ./sklep-frontend
      dockerfile: Dockerfile
    container_name: sklep-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

  identity-db:
    image: postgres:16-alpine
    container_name: sklep-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_pass
    volumes:
      - identity-data:/var/lib/postgresql/data

  catalog-db:
    image: postgres:16-alpine
    container_name: sklep-catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
    volumes:
      - catalog-data:/var/lib/postgresql/data

  sales-mongo:
    image: mongo:7
    container_name: sklep-sales-mongo
    volumes:
      - sales-mongo-data:/data/db

  sales-redis:
    image: redis:7-alpine
    container_name: sklep-sales-redis
    volumes:
      - sales-redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sklep-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  identity-data:
  catalog-data:
  sales-mongo-data:
  sales-redis-data:
